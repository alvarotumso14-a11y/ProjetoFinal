<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon: arquivo PNG da logo -->
    <link rel="icon" type="image/png" href="Logos/Favicon.png">
    <title>Histórico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h18M3 12h18M3 17h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <a class="dashboard-logo-botao topbar-logo" href="dashboard.html" aria-label="Ir para o Dashboard">
            <img src="Logos/high-resolution-color-logo.png" alt="Dashboard">
        </a>

        <div class="user-top">
            <div class="foto">
                <img src="" alt="Foto do usuário">
            </div>
            <div class="user-info">
                <p>Nome do Usuário</p>
                <p>Tipo de Diabetes</p>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a class="dashboard-logo-botao sidebar-logo" href="dashboard.html" aria-label="Ir para o Dashboard">
                    <img src="Logos/high-resolution-color-logo.png" alt="Dashboard">
                </a>
                <button class="menu-toggle sidebar-close" type="button" aria-label="Fechar menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <nav class="navigation" aria-label="Menu principal">
                <ul>
                    <li><a href="dashboard.html">Home</a></li>
                    <li><a class="ativo" href="historico.html">Histórico</a></li>
                    <li><a href="Calculadora.html">Calculadora</a></li>
                    <li><a href="glicbot.html">TiaBete</a></li>
                
                </ul>
            </nav>
        </aside>

        <main class="conteudo">
            <header>
                <div>
                    <h1>Histórico</h1>
                    <p>Todos os registros realizados.</p>
                    <button class="pdf-button" id="BaixarPdf" type="button">Baixar PDF</button>
                </div>
            </header>

            <div class="pesquisa">
                <input
                    type="date"
                    id="pesquisa"
                    aria-label="Pesquisar por data"
                >
            </div>

            <section class="historico">
                <div class="titulo">
                    <h2>Últimos Registros</h2>
                </div>

                <div id="historicoLista"></div>
            </section>
        </main>
    </div>

    <div id="modalEdicaoRegistro" class="modal" aria-hidden="true">
        <div class="modal-box modal-box-small">
                <div class="modal-topo">
                    <div>
                        <span class="modal-kicker">Histórico</span>
                        <h2>Alterar registro</h2>
                    </div>
                    <button class="close" type="button" aria-label="Fechar" onclick="fecharModalEdicao()">&times;</button>
                </div>
                <div class="modal-corpo">
                    <form id="formEdicaoRegistro" class="edit-form">
                        <div class="form-grid">
                            <label for="editRegistroGlicemia">Glicemia (mg/dL)<input type="number" id="editRegistroGlicemia" min="1" max="600" required></label>
                            <label for="editRegistroDose">Dose de insulina (U)<input type="number" id="editRegistroDose" min="0" max="600" step="0.1" required></label>
                            <label for="editRegistroHora">Horário<input type="time" id="editRegistroHora" required></label>
                            <label class="full-width" for="editRegistroObservacao">Observações<textarea id="editRegistroObservacao" rows="4" placeholder="Digite uma observação sobre este registro..."></textarea></label>
                        </div>
                        <div class="modal-actions">
                            <button class="button-secondary" type="button" onclick="fecharModalEdicao()">Cancelar</button>
                            <button type="submit">Salvar alterações</button>
                        </div>
                    </form>
                </div>
        </div>
    </div>

    <script src="Js/profile.js"></script>
    <script src="Js/menu.js"></script>
    <script src="Js/historico.js"></script>
</body>
</html>
