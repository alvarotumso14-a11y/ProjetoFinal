<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Logos/Favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>Perfil</title>
</head>
<body>
    <!-- Página: Perfil
         Esta página mostra as informações do usuário (nome, tipo de diabetes, idade, email, celular)
         A foto no topo é clicável e leva à esta página. O script Js/profile.js carrega/salva os dados em localStorage
         Estrutura principal: topbar compartilhado, sidebar e área de conteúdo (.conteudo). -->
    <div class="topbar">
        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h18M3 12h18M3 17h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <a class="dashboard-logo-botao topbar-logo" href="dashboard.html" aria-label="Ir para o Dashboard">
            <img src="Logos/high-resolution-color-logo.png" alt="Dashboard">
        </a>

        <div class="user-top">
            <div class="foto">
                <img src="" alt="Foto do usuário">
            </div>
            <div class="user-info">
                <p>Nome do Usuário</p>
                <p>Tipo de Diabetes</p>
            </div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a class="dashboard-logo-botao sidebar-logo" href="dashboard.html" aria-label="Ir para o Dashboard">
                    <img src="Logos/high-resolution-color-logo.png" alt="Dashboard">
                </a>
                <button class="menu-toggle sidebar-close" type="button" aria-label="Fechar menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
            </div>

            <nav class="navigation" aria-label="Menu principal">
                <ul>
                    <li><a href="historico.html">Histórico</a></li>
                    <li><a href="glicbot.html">GlicBot</a></li>
                    <li><a href="Calculadora.html">Calculadora</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo">
            <header>
                <div>
                    <h1>Perfil</h1>
                    <p>Informações do usuário</p>
                </div>
            </header>

            <section class="perfil">
                <!-- Novo layout em cartões: foto à esquerda e cartões com cada campo à direita -->
                <div class="perfil-cards">
                    <div class="perfil-card foto-card">
                        <div class="foto-grande" role="img" aria-label="Foto do usuário">FT</div>
                        <button class="botao-alt" onclick="editarPerfil()" aria-label="Editar informações">
                            <span class="button-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>
                            </span>
                            Editar perfil
                        </button>
                    </div>

                    <div class="perfil-card">
                        <div class="card-key">Nome</div>
                        <div class="card-value" id="nome">Nome do Usuário</div>
                    </div>

                    <div class="perfil-card">
                        <div class="card-key">Tipo de Diabetes</div>
                        <div class="card-value" id="tipo">Tipo de Diabetes</div>
                    </div>

                    <div class="perfil-card">
                        <div class="card-key">Idade</div>
                        <div class="card-value" id="idade">—</div>
                    </div>

                    <div class="perfil-card">
                        <div class="card-key">Email</div>
                        <div class="card-value" id="email">usuario@exemplo.com</div>
                    </div>

                    <div class="perfil-card">
                        <div class="card-key">Celular</div>
                        <div class="card-value" id="celular">(00) 00000-0000</div>
                    </div>

                    <div class="perfil-card">
                        <div class="card-key">Fator de sensibilidade</div>
                        <div class="card-value" id="fator">-</div>
                    </div>

                    <div class="perfil-card">
                        <div class="card-key">HGT alvo</div>
                        <div class="card-value" id="hgtAlvo">-</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="Js/profile.js"></script>
    <script src="Js/menu.js"></script>
</body>
</html>
