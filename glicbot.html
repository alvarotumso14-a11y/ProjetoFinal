<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="Logos/Favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>GlicBot</title>
</head>
<body>
    <div class="topbar">
        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h18M3 12h18M3 17h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="user-top">
            <div class="foto"><img src="" alt="Foto do usuário"></div>
            <div class="user-info"><p>Nome do Usuário</p><p>Tipo de Diabetes</p></div>
        </div>
    </div>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="container">
        <aside class="sidebar">
            <button class="menu-toggle sidebar-close" type="button" aria-label="Fechar menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <nav class="navigation" aria-label="Menu principal">
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="historico.html">Histórico</a></li>
                    <li><a href="calculadora.html">Calculadora</a></li>
                    <li><a class="ativo" href="glicbot.html">GlicBot</a></li>
                </ul>
            </nav>
        </aside>

        <main class="conteudo">
            <header>
                <div>
                    <h1>GlicBot</h1>
                    <p>Dicas e alertas para o seu dia a dia</p>
                </div>
            </header>

            <section class="chat-container">
                <div class="chat-mensagens" id="chatMensagens"></div>

                <div class="chat-sugestoes" id="chatSugestoes">
                    <button class="chip" data-msg="Estou com sinais de hipoglicemia">Hipoglicemia</button>
                    <button class="chip" data-msg="Minha glicemia está alta">Hiperglicemia</button>
                    <button class="chip" data-msg="Dicas de alimentação">Alimentação</button>
                    <button class="chip" data-msg="Posso fazer exercício?">Exercício</button>
                    <button class="chip" data-msg="Como aplicar insulina?">Insulina</button>
                </div>

                <form class="chat-input-area" id="chatForm">
                    <input type="text" id="chatInput" placeholder="Pergunte algo ao GlicBot..." autocomplete="off">
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>
    </div>

    <script src="Js/profile.js"></script>
    <script src="Js/menu.js"></script>
    <script src="Js/glicbot.js"></script>
</body>
</html>
